query FetchCategory($id: String) {
  category(id: $id) {
    ...CategoryAssetsFragment
  }
}

fragment CategoryAssetFragment on Asset {
  id
  key
  nameAllLocales {
    locale
    value
  }
  descriptionAllLocales {
    locale
    value
  }
  sources {
    key
    uri
    contentType
    dimensions {
      width
      height
    }
  }
}

fragment CategoryAssetsFragment on Category {
  id
  key
  version
  assets {
    ...CategoryAssetFragment
  }
}
